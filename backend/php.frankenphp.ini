; HMS / Octane FrankenPHP runtime tuning
; --------------------------------------
; The embedded PHP 8.5.6 inside the frankenphp binary loads this file
; via PHPRC=/var/www/hms-backend/php.frankenphp.ini set in the
; hms-octane.service systemd unit. Without this override the embedded
; runtime falls back to PHP compile-time defaults (2M / 8M / 128M),
; which silently caps PDF uploads on /api/worker-documents/upload.

; Upload limits (must match Laravel's `max:10240` validation = 10 MB)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; Memory / time
memory_limit = 256M
max_execution_time = 60

; OPcache - the embedded PHP supports the same opcache options
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; Realpath
realpath_cache_size = 4M
realpath_cache_ttl = 600
